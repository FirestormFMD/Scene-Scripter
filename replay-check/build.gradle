// A client with Fabric API and Replay Mod but without Scene Scripter, to check that recordings of scenes play back
// in a game that doesn't have the mod. CI feeds it a recording made by the recorder client game test.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

fabricApi {
	configureTests {
		modId = "replaycheck"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Replay Mod 2.6.27 for Minecraft 26.2, by Modrinth version ID.
	localRuntime 'maven.modrinth:replaymod:5YS1OgDP'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
