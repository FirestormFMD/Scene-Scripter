// A client with Fabric API and a recorder but without Scene Scripter, to check that recordings of scenes play back
// in a game that doesn't have the mod. CI feeds it recordings made by the recorder client game test:
// `./gradlew :replay-check:runClientGameTest -Precorder=flashback` (or replaymod, the default).
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

fabricApi {
	configureTests {
		modId = "replaycheck"
		eula = true
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Flashback 0.43.6 or Replay Mod 2.6.27 for Minecraft 26.2, by Modrinth version ID.
	def recorders = [flashback: 'Um7qd3Na', replaymod: '5YS1OgDP']
	def recorder = project.findProperty('recorder') ?: 'replaymod'
	if (!recorders.containsKey(recorder)) {
		throw new GradleException("Unknown recorder ${recorder}; use flashback or replaymod")
	}
	localRuntime "maven.modrinth:${recorder}:${recorders[recorder]}"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
