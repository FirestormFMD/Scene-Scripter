plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The jar below packages core's compiled classes, so core must be configured first.
evaluationDependsOn(':core')

base {
	archivesName = 'scene-scripter'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"scenescripter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game tests live in src/gametest. Server game tests run with `build`, client game tests with
	// `runClientGameTest` (CI runs them under xvfb).
	configureTests {
		createSourceSet = true
		modId = "scenescripter-test"
		eula = true // Accepts the Minecraft EULA for the test server.
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':core')
	gametestImplementation project(':core')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// Core is plain Java with no Minecraft dependency, so it ships inside the mod jar.
	from(project(':core').sourceSets.main.output)

	from(rootProject.file("LICENSE")) {
		rename { "${it}_scene-scripter" }
	}
}
