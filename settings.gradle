pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'scene-scripter'

// Minecraft-free logic (scene model, splines, locomotion, journal). Builds and tests without Minecraft.
include 'core'
// The Fabric mod itself. Depends on core.
include 'fabric'
// Test only: a client without Scene Scripter that plays scene recordings back in Replay Mod.
include 'replay-check'
