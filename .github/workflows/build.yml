# Builds the mod and runs the tests on every push and pull request. Server game tests run as part of
# `build`; client game tests start a real client under a virtual display.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            fabric/build/run/**/logs/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: fabric/build/libs/

  client_game_test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest
      - name: capture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test
          path: |
            fabric/build/run/**/screenshots/
            fabric/build/run/**/logs/
            fabric/build/run/**/crash-reports/
