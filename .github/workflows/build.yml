# Builds the mod and runs the tests on every push and pull request. Server game tests run as part of
# `build`; client game tests start a real client under a virtual display.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            fabric/build/run/**/logs/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: fabric/build/libs/

  client_game_test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Alone, and beside each recorder the plan targets (their 26.2 builds from Modrinth).
        recorder: [none, flashback, replaymod]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest -Precorder=${{ matrix.recorder }}
      - name: capture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-${{ matrix.recorder }}
          path: |
            fabric/build/run/**/screenshots/
            fabric/build/run/**/logs/
            fabric/build/run/**/crash-reports/
      - name: keep the replay mod recordings
        if: matrix.recorder == 'replaymod'
        uses: actions/upload-artifact@v7
        with:
          name: scene-recordings
          path: fabric/build/run/**/replay_recordings/**/*.mcpr
          if-no-files-found: error

  # Plays the recordings Replay Mod made of the scenes back in a game without Scene Scripter.
  replay_without_scene_scripter:
    needs: client_game_test
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: fetch the recordings
        uses: actions/download-artifact@v7
        with:
          name: scene-recordings
          path: recordings
      - name: play them back without scene scripter
        env:
          SCENE_RECORDINGS: ${{ github.workspace }}/recordings
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :replay-check:runClientGameTest
      - name: capture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-without-scene-scripter
          path: |
            replay-check/build/run/**/screenshots/
            replay-check/build/run/**/logs/
            replay-check/build/run/**/crash-reports/
